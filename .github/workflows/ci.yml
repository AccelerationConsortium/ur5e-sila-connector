name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install dependencies (macOS and Linux)
        if: runner.os != 'Windows'
        run: uv sync --locked --all-extras
      - name: Install dependencies with Windows wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Validate (macOS and Linux)
        if: runner.os != 'Windows'
        run: |
          uv run --no-sync ruff format --check src/
          uv run --no-sync ruff check src/
          uv run --no-sync pytest -q
      - name: Validate with Windows wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/run.ps1 ruff format --check src/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/run.ps1 ruff check src/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/run.ps1 pytest -q
          exit $LASTEXITCODE
